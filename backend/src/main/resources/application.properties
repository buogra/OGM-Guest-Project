spring.application.name=ogm-reservation
# Server
server.port=8080
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# JPA / Hibernate — schema is managed by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# JWT — supply a Base64-encoded secret of at least 32 bytes via env variable
app.jwt.secret=${JWT_SECRET}
# CORS — FRONTEND_ORIGIN env variable is read directly in WebConfig (fallback: http://localhost:3000)
